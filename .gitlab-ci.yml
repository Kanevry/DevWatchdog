# DevWatchdog — GitLab CI (macOS)
#
# Requires: macOS runner with tag "macbook-swift"
# Migrated from GitHub Actions build.yml

stages:
  - build
  - test

variables:
  SCHEME: DevWatchdog
  PROJECT: DevWatchdog.xcodeproj
  DESTINATION: "platform=macOS"

build:
  tags:
    - macbook-swift
  stage: build
  before_script:
    - xcodebuild -version
  script:
    - xcodebuild
        -project ${PROJECT}
        -scheme ${SCHEME}
        -configuration Release
        -derivedDataPath build
        -destination "${DESTINATION}"
        CODE_SIGN_IDENTITY=""
        CODE_SIGNING_REQUIRED=NO
        build
  artifacts:
    paths:
      - build/Build/Products/Release/DevWatchdog.app
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

test:
  tags:
    - macbook-swift
  stage: test
  script:
    - xcodebuild
        -project ${PROJECT}
        -scheme ${SCHEME}
        -configuration Debug
        -derivedDataPath build
        -destination "${DESTINATION}"
        CODE_SIGN_IDENTITY=""
        CODE_SIGNING_REQUIRED=NO
        test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
